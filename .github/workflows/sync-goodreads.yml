name: Sync Goodreads

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync currently reading + draft new five-stars
        run: python scripts/sync-goodreads.py

      - name: Commit and push if changed
        run: |
          git add js/books.js
          if [ -f js/drafts.js ]; then git add js/drafts.js; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync from Goodreads"
            git push
          else
            echo "No changes"
          fi
